<!doctype html>
{% set user_lang = frappe.lang or 'en' %}
{% set is_rtl = user_lang in ['ar', 'he', 'fa', 'ur', 'ku'] %}
<html lang="{{ user_lang }}" dir="{{ 'rtl' if is_rtl else 'ltr' }}">
  <head>
    <meta charset="UTF-8" />
    <!-- Patch 15: desk logo (erp_restaurant branding.py) -->
    <link rel="icon" href="{{ favicon }}" />
    <script>window.app_logo_url = {{ (app_logo_url or "") | tojson }};</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>URY POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.csrf_token = "{{ csrf_token }}";
      if (!window.frappe) window.frappe = {};
      window.app_name = "{{ app_name }}";
      frappe.boot = JSON.parse({{ boot }});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
